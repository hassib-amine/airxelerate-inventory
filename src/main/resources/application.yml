# Application
spring:
  application:
    name: flight-inventory
  profiles:
    active: ${AIRXELERATE_INVENTORY_ENV:local}
  # Database (MySQL) - values from application-local.yml
  datasource:
    url: ${airxelerate.inventory.datasource.url}
    username: ${airxelerate.inventory.datasource.username}
    password: ${airxelerate.inventory.datasource.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${airxelerate.inventory.jpa.ddl-auto}
    show-sql: ${airxelerate.inventory.jpa.show-sql}
    properties:
      hibernate:
        format_sql: ${airxelerate.inventory.jpa.format-sql}
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${airxelerate.inventory.server.port}

# JWT Configuration - values from application-local.yml
jwt:
  secret: ${airxelerate.inventory.jwt.secret}
  expiration: ${airxelerate.inventory.jwt.expiration}

# Logging
logging:
  level:
    com.airxelerate.inventory: ${airxelerate.inventory.logging.level:INFO}
    org.springframework.security: ${airxelerate.inventory.logging.level.security:INFO}


# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.airxelerate.inventory.controller
  paths-to-match: /api/**
  show-actuator: false
